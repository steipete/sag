version: 2
project_name: sag

before:
  hooks:
    - ./scripts/check-release-metadata

builds:
  - id: sag-darwin
    main: ./cmd/sag
    binary: sag
    flags: [-trimpath]
    ldflags: [-s -w -linkmode=external]
    env:
      - CGO_ENABLED=1
      - MACOSX_DEPLOYMENT_TARGET=15.0
      # Explicit flags also put the minimum in Go's cgo build cache key.
      - CGO_CFLAGS=-O2 -g -mmacosx-version-min=15.0
      - CGO_LDFLAGS=-O2 -g -mmacosx-version-min=15.0
    # The shared split-host preflight reads goos, not GoReleaser targets.
    goos: [darwin]
    goarch: [amd64, arm64]
    hooks:
      post:
        - cmd: ./scripts/check-macos-target "{{ .Path }}"

archives:
  - ids: [sag-darwin]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, LICENSE]

checksum:
  name_template: SHA256SUMS
changelog:
  disable: true
